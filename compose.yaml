services:
  ###> forum-docker ###
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stayzy_php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:rw
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-pidev_db}?serverVersion=8.0&charset=utf8mb4
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pidev_db}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - stayzy_network

  nginx:
    image: nginx:alpine
    container_name: stayzy_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - stayzy_network

  database:
    image: mysql:8.0
    container_name: stayzy_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pidev_db}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
    volumes:
      - database_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" || exit 1',
        ]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - stayzy_network

volumes:
  database_data:

networks:
  stayzy_network:
    driver: bridge
